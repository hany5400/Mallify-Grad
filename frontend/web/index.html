<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mallify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mallify</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Premium Loading Screen Styling */
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
      opacity: 1;
      visibility: visible;
    }
    
    .logo-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .loading-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      animation: logo-pulse 2s infinite ease-in-out;
    }
    
    .spinner-ring {
      position: absolute;
      width: 108px;
      height: 108px;
      border: 3px solid transparent;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    
    .loading-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: 0.5px;
      margin: 12px 0 0 0;
      animation: fade-in 1s ease-out;
    }

    .loading-subtext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      margin-top: 6px;
    }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-container">
      <div class="spinner-ring"></div>
      <img class="loading-logo" src="logo.png" alt="Mallify Logo" />
    </div>
    <p class="loading-text">Loading Mallify</p>
    <p class="loading-subtext">Optimizing your experience...</p>
  </div>
  
  <script>
    // Smooth fade out of the loader when the Flutter canvas is injected
    (function() {
      var loader = document.getElementById('loading-indicator');
      var observer = new MutationObserver(function(mutations, obs) {
        for (var i = 0; i < mutations.length; i++) {
          var addedNodes = mutations[i].addedNodes;
          for (var j = 0; j < addedNodes.length; j++) {
            var node = addedNodes[j];
            if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'CANVAS') {
              if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                setTimeout(function() {
                  loader.remove();
                }, 400);
              }
              obs.disconnect();
              return;
            }
          }
        }
      });
      observer.observe(document.body, { childList: true });
      
      // Fallback: Remove loader after 15 seconds if loading fails or takes too long
      setTimeout(function() {
        if (loader && loader.parentNode) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(function() {
            loader.remove();
          }, 400);
          observer.disconnect();
        }
      }, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
